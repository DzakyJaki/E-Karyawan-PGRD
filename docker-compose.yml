services:
  # ---------------------------------------------------------------------------
  # E-KARYAWAN Web Application Service (Nginx Alpine)
  # Folder VPS: /home/manajement_absensi/
  # ---------------------------------------------------------------------------
  e-karyawan:
    build:
      context: .
      dockerfile: Dockerfile
    image: e-karyawan:latest
    container_name: e-karyawan
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      # Mount folder WebServer di /home/manajement_absensi/WebServer ke Nginx
      # Cukup upload file build baru ke folder WebServer tanpa perlu rebuild container
      - ./WebServer:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
